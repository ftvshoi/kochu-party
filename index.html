<style>
/* Layout: 형's room at night is the stage — warm plank floor, navy polka-dot blanket from the photos, lamp light. Canvas fills the screen; lobby, roulette, rules, results are sheets over it; one big thumb button bottom-right. */
:root{
  --night:#17152b; --floor:#4b3426; --lamp:#ffd59a; --coral:#ff8a68; --sky:#7ec6ff; --tag:#ff5a5f; --ok:#8fe08a;
  --ink:#f6ecdc; --mute:#aaa3c6; --sheet:#1f1c38; --line:rgba(255,255,255,.12);
  --f-disp:'Jua','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  --f-body:'Gowun Dodum','Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
#stage{position:fixed;inset:0;z-index:0;touch-action:none}
#cv{display:block;width:100%;height:100%}

#hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.chip{background:rgba(23,21,43,.78);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:15px var(--f-disp);white-space:nowrap;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#chipC{min-width:0;overflow:hidden;text-overflow:ellipsis}
#chipC.it{background:rgba(255,90,95,.9);color:#fff;border-color:transparent}
#chipC.run{color:var(--sky)}
#chipC.go{color:var(--lamp)}
#chipL.low{color:var(--tag)}
#hud{padding-right:calc(max(16px,env(safe-area-inset-right,0px)) + 46px)!important}
#snd{position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 8px);right:max(16px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(23,21,43,.8);color:var(--ink);padding:0;display:flex;align-items:center;justify-content:center}
#snd svg{width:20px;height:20px}
#snd.off{color:var(--mute)}

#big{position:fixed;z-index:7;left:0;right:0;top:32%;text-align:center;font:80px/1 var(--f-disp);color:var(--lamp);text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 40px rgba(255,213,154,.5);pointer-events:none;padding:0 16px}
#big.sm{font-size:34px}
#big.red{color:#ff9ea0;text-shadow:0 4px 0 rgba(0,0,0,.35),0 0 40px rgba(255,90,95,.6)}
#big.pop{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(1.5);opacity:.2}to{transform:scale(1);opacity:1}}

#act{--cd:0;position:fixed;z-index:6;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:92px;height:92px;border-radius:50%;border:0;padding:0;
  background:var(--lamp);color:#2b1b0b;font:22px var(--f-disp);touch-action:none;box-shadow:0 6px 0 #a06a2c,0 12px 26px rgba(0,0,0,.45)}
#act::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;background:conic-gradient(rgba(23,21,43,.66) calc(var(--cd)*1turn),transparent 0)}
#act.down{transform:translateY(4px);box-shadow:0 2px 0 #a06a2c,0 8px 18px rgba(0,0,0,.45)}
#act.off{filter:saturate(.2) brightness(.7)}

#qcard{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 52px);
  max-width:520px;margin:0 auto;background:#fbf1de;color:#2b1b0b;border-radius:18px;padding:12px 16px 14px;box-shadow:0 6px 0 rgba(0,0,0,.25);pointer-events:none;display:flex;flex-direction:column;gap:8px}
#qcard .qn{font:13px var(--f-disp);color:#a0703c;margin:0}
#qcard .qt{font:20px/1.35 var(--f-disp);margin:0;text-wrap:balance}
#qcard .bar{height:8px;border-radius:4px;background:#ead9bb;overflow:hidden}
#qcard .bar i{display:block;height:100%;background:#ff8a68;border-radius:4px}
#qcard .ex{font-size:14px;margin:0;color:#5a4330}
#qcard .ans{font:18px var(--f-disp);margin:0}

.panel{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:center;gap:16px;overflow-y:auto;touch-action:pan-y;
  padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 70% at 50% 0%,rgba(255,213,154,.16),rgba(23,21,43,0) 60%),var(--night)}
.panel.see{background:rgba(23,21,43,.82);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.panel>*{width:100%;max-width:460px;margin-left:auto;margin-right:auto;box-sizing:border-box}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--lamp);margin:0}
h1{font:40px/1.1 var(--f-disp);margin:0;text-wrap:balance}
h2{font:32px/1.15 var(--f-disp);margin:0;text-wrap:balance}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;color:var(--mute);font-size:15px}
.rules li{padding-left:16px;position:relative}
.rules li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--lamp)}
.picks{display:flex;gap:8px;flex-wrap:wrap}
.pick{flex:1 1 56px;min-width:56px;background:none;border:0;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:var(--mute)}
.face{border-radius:50%;overflow:hidden;box-sizing:border-box;background:#2b2748;display:flex;align-items:center;justify-content:center;font-family:var(--f-disp);color:var(--mute)}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.pick .face{width:56px;height:56px;border:3px solid transparent;font-size:22px}
.pick[aria-pressed="true"]{color:var(--ink)}
.pick[aria-pressed="true"] .face{border-color:var(--lamp);box-shadow:0 0 18px rgba(255,213,154,.45)}
.statbox{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.statbox p{margin:0 0 2px;color:var(--mute);font-size:14px}
.st{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:8px;font-size:14px}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.12)}
.pips i.on{background:var(--lamp)}
label.f{display:flex;flex-direction:column;gap:6px;color:var(--mute);font-size:14px}
input[type=text]{font:17px var(--f-body);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:12px 14px;user-select:text;-webkit-user-select:text}
input[type=text]:focus-visible,button:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.btn{font:19px var(--f-disp);border:0;border-radius:14px;padding:14px 18px;background:var(--lamp);color:#2b1b0b;box-shadow:0 4px 0 #a06a2c}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #a06a2c}
.btn[disabled]{opacity:.5;box-shadow:none}
.btn.ghost{background:none;color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:16px}
.okc{color:var(--lamp)!important}
.msg{min-height:1.4em;margin:0;color:var(--sky);font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.card .face{width:76px;height:76px;border:4px solid var(--coral);font-size:28px}
.card.peer .face{border-color:var(--sky)}
.card.empty .face{border-style:dashed;border-color:var(--line)}
.card .who{font:17px var(--f-disp)}
.card .state{font-size:13px;color:var(--mute)}
.card .state.ok{color:var(--lamp)}
.card .st{grid-template-columns:34px 1fr;width:100%;font-size:12px;gap:6px}
.card .pips i{height:6px}

.wheel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wheel div{background:var(--sheet);border:2px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font:15px var(--f-disp);color:var(--mute);min-width:0;transition:transform .08s}
.wheel div.on{background:var(--lamp);color:#2b1b0b;border-color:var(--lamp);transform:scale(1.06)}
.gpick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gpick button{background:var(--sheet);border:2px solid var(--line);border-radius:12px;padding:10px 6px;font:15px var(--f-disp);color:var(--mute);min-width:0}
.gpick button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#2b1b0b}
.wheel div.pick-final{background:var(--coral);border-color:var(--coral);color:#2b1b0b;transform:scale(1.1)}
.btnrow{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px}
.btnrow b{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:40px;padding:0 12px;border-radius:999px;background:var(--lamp);color:#2b1b0b;font:17px var(--f-disp);font-weight:normal}
.vs{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.vs .st{grid-template-columns:56px 1fr}
.cnt{font:72px/1 var(--f-disp);color:var(--lamp);text-align:center;margin:0;font-variant-numeric:tabular-nums}
.score{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:10px;font:15px var(--f-disp)}
.srow .face{width:44px;height:44px;border:3px solid var(--coral);font-size:18px}
.srow.op .face{border-color:var(--sky)}
.acs{display:flex;gap:6px}
.acs i{width:22px;height:26px;border-radius:50% 50% 46% 46%;background:rgba(255,255,255,.1);position:relative}
.acs i.on{background:#c4863f}
.acs i.on::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:11px;border-radius:12px 12px 4px 4px;background:#6b4a2a}
#rres{position:fixed;z-index:10;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;
  padding:40px max(20px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  background:linear-gradient(to top,rgba(23,21,43,.98) 75%,rgba(23,21,43,0))}
#rres>*{width:100%;max-width:460px;margin-left:auto;margin-right:auto;box-sizing:border-box}
#rres p{margin:0;color:var(--mute)}
@media (prefers-reduced-motion:reduce){#big.pop{animation:none}.wheel div{transition:none}}
#emoB{position:fixed;z-index:12;top:calc(env(safe-area-inset-top,0px) + 54px);right:max(16px,env(safe-area-inset-right,0px));width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(23,21,43,.8);padding:0;font-size:20px;line-height:36px}
#emoP{position:fixed;z-index:13;top:calc(env(safe-area-inset-top,0px) + 100px);right:max(12px,env(safe-area-inset-right,0px));width:min(300px,calc(100vw - 24px));display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;border-radius:18px;background:rgba(23,21,43,.94);border:1px solid var(--line);box-shadow:0 12px 30px rgba(0,0,0,.5)}
#emoP button{border:0;background:rgba(255,255,255,.06);border-radius:12px;padding:6px 2px 4px;color:var(--ink);font:12px var(--f-disp);display:flex;flex-direction:column;align-items:center;gap:3px}
#emoP button:active{background:rgba(255,213,154,.25)}
.emf{position:relative;width:46px;height:46px}
.emf img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2px solid #f6ecdc}
.emf b{position:absolute;right:-6px;bottom:-4px;font-size:20px;font-weight:400}
.stk{position:fixed;z-index:11;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:stkIn .35s cubic-bezier(.3,1.6,.5,1),stkOut .4s ease-in 2.1s forwards}
.stk .emf{width:96px;height:96px}.stk .emf img{border-width:4px;box-shadow:0 8px 22px rgba(0,0,0,.45)}.stk .emf b{font-size:38px;right:-10px;bottom:-6px}
.stk>span:not(.emf){margin-top:6px;background:#f6ecdc;color:#2b1b0b;font:19px var(--f-disp);padding:5px 12px;border-radius:14px;white-space:nowrap;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.stk.op .emf img{border-color:#7ec6ff}.stk.op>span:not(.emf){background:#7ec6ff;color:#10213a}
.stk.me .emf img{border-color:#ff8a68}
.stk .who{background:transparent!important;box-shadow:none!important;color:var(--ink)!important;font-size:13px!important;padding:0!important;margin-top:2px}
@keyframes stkIn{from{transform:scale(.2) rotate(-15deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes stkOut{to{transform:translateY(-30px) scale(.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.stk{animation:stkOut .4s ease-in 2.1s forwards}}
/* 넘칠 때 위가 잘리지 않게 */
.panel{justify-content:flex-start}.panel>:first-child{margin-top:auto}.panel>:last-child{margin-bottom:auto}
.panel>*,#rres>*{margin-left:auto!important;margin-right:auto!important}
/* ===== 바느질 테마: 형 방 이불 위 솜인형 공방. 모든 판은 천 조각, 테두리는 바늘땀, 제목은 인형 케어 라벨. ===== */
:root{
  --night:#1d1a3a; --sheet:#2c2858; --felt2:#3a3470; --cream:#fff4e0; --thread:#7a4e36; --bark:#3a2414;
  --lamp:#ffd47a; --coral:#ff8a68; --sky:#8cc8ff; --cheek:#ff9fb5;
  --ink:#fbf3e6; --mute:#bdb6df; --line:rgba(255,244,224,.16); --stitch:rgba(255,244,224,.34);
  --dots:radial-gradient(rgba(255,244,224,.075) 1.7px,transparent 2.2px) 0 0/30px 30px,radial-gradient(rgba(255,244,224,.05) 1.7px,transparent 2.2px) 15px 15px/30px 30px;
}
body{background:var(--dots),var(--night)}
.panel{background:radial-gradient(85% 50% at 50% -8%,rgba(255,212,122,.24),transparent 64%),var(--dots),var(--night);gap:18px}
.panel.see{background:radial-gradient(85% 50% at 50% -8%,rgba(255,212,122,.18),transparent 64%),rgba(24,21,52,.86)}
/* 천 조각 */
.statbox,.card,.vs,.wheel div,.gpick button,#emoP{background:var(--sheet);border:2px dashed var(--stitch);border-radius:18px;
  box-shadow:0 0 0 5px var(--sheet),0 9px 0 5px rgba(8,6,24,.42)}
.duo,.wheel,.gpick{gap:16px}
.wheel div,.gpick button{padding:12px 6px;color:var(--ink);font-size:15px}
.wheel div.on{background:var(--lamp);color:var(--bark);border-color:rgba(122,78,54,.5);box-shadow:0 0 0 5px var(--lamp),0 0 34px 8px rgba(255,212,122,.45),0 9px 0 5px #b07a2e}
.wheel div.pick-final{background:var(--cheek);color:var(--bark);border-color:rgba(122,78,54,.5);box-shadow:0 0 0 5px var(--cheek),0 9px 0 5px #b8566f;animation:wob .5s ease-in-out 2}
@keyframes wob{25%{transform:scale(1.1) rotate(-3deg)}75%{transform:scale(1.1) rotate(3deg)}}
.gpick button[aria-pressed="true"]{background:var(--lamp);color:var(--bark);border-color:rgba(122,78,54,.5);box-shadow:0 0 0 5px var(--lamp),0 9px 0 5px #b07a2e}
/* 단추 */
.btn{border-radius:999px;background:var(--lamp);color:var(--bark);border:2px dashed rgba(122,78,54,.5);box-shadow:0 0 0 4px var(--lamp),0 9px 0 4px #b07a2e;padding:13px 18px;margin:4px 0}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 4px var(--lamp),0 5px 0 4px #b07a2e}
.btn[disabled]{opacity:.55}
.btn.ghost{background:var(--felt2);color:var(--ink);border:2px dashed var(--stitch);box-shadow:0 0 0 4px var(--felt2),0 8px 0 4px rgba(8,6,24,.5)}
.btn.ghost:active{box-shadow:0 0 0 4px var(--felt2),0 4px 0 4px rgba(8,6,24,.5)}
input[type=text]{background:var(--sheet);border:2px dashed var(--stitch);border-radius:16px}
.eyebrow{letter-spacing:0;font-size:14px}
/* 케어 라벨 (제목) */
.ctag{position:relative;align-self:center;width:auto!important;max-width:340px!important;background:var(--cream);color:var(--bark);border-radius:10px 10px 18px 18px;padding:26px 30px 18px;text-align:center;
  outline:2px dashed rgba(122,78,54,.45);outline-offset:-9px;box-shadow:0 12px 0 rgba(8,6,24,.35),0 24px 40px rgba(0,0,0,.35);transform:rotate(-2.5deg);transform-origin:50% -30px;animation:sway 2.4s cubic-bezier(.3,1.4,.5,1) 1}
.ctag::before{content:"";position:absolute;left:50%;top:-34px;width:2px;height:40px;background:rgba(255,244,224,.5);transform:translateX(-50%)}
.ctag::after{content:"";position:absolute;left:50%;top:9px;width:12px;height:12px;border-radius:50%;background:var(--night);transform:translateX(-50%);box-shadow:inset 0 2px 0 rgba(0,0,0,.3)}
.ctag h1{font-size:44px;color:var(--bark);margin:6px 0 4px;letter-spacing:-.5px}
.ctag .care{margin:0;font-size:13px;color:#8a6448;line-height:1.5}
.ctag .faces{display:flex;justify-content:center;gap:4px;margin-top:8px}
.ctag .faces img{width:26px;height:26px;border-radius:50%;object-fit:cover;border:2px solid #e8d3b0}
@keyframes sway{0%{transform:rotate(9deg)}45%{transform:rotate(-5deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(-2.5deg)}}
/* 캐릭터 고르기: 솜 단추 */
.pick .face{width:60px;height:60px;border:3px dashed var(--stitch);box-shadow:0 0 0 3px var(--sheet),0 6px 0 3px rgba(8,6,24,.4)}
.pick[aria-pressed="true"] .face{border:3px dashed rgba(122,78,54,.6);box-shadow:0 0 0 4px var(--cheek),0 0 22px 6px rgba(255,159,181,.45),0 7px 0 4px #b8566f}
.pick[aria-pressed="true"]{color:var(--cheek)}
.pips{gap:5px}.pips i{height:9px;border-radius:5px;background:rgba(255,244,224,.1)}.pips i.on{background:var(--lamp);box-shadow:inset 0 -2px 0 rgba(122,78,54,.35)}
.rules li::before{content:"×";background:none;width:auto;height:auto;left:0;top:-.05em;color:var(--lamp);font:15px var(--f-disp)}
.rules li{padding-left:18px}
/* 게임 소개: 라벨 + 단추 카운트 */
#introName{background:var(--cream);color:var(--bark);padding:16px 18px 14px;border-radius:12px;outline:2px dashed rgba(122,78,54,.45);outline-offset:-8px;transform:rotate(-1.5deg);
  box-shadow:0 10px 0 rgba(8,6,24,.35);font-size:34px;text-align:center}
#intro .rules{color:var(--ink);font-size:16px}
.cnt{width:96px;height:96px;border-radius:50%;margin:6px auto 0;display:flex;align-items:center;justify-content:center;background:var(--lamp);color:var(--bark);font-size:54px;
  border:3px dashed rgba(122,78,54,.5);box-shadow:0 0 0 6px var(--lamp),0 10px 0 6px #b07a2e;box-sizing:border-box}
.cnt:empty{visibility:hidden}
.btnrow b{border:2px dashed rgba(122,78,54,.5);box-shadow:0 0 0 3px var(--lamp);color:var(--bark)}
/* HUD · 버튼 */
.chip{background:var(--sheet);border:2px dashed var(--stitch);box-shadow:0 0 0 3px var(--sheet),0 5px 0 3px rgba(8,6,24,.45)}
#chipC.it{background:#ff6b7a;border-color:rgba(255,255,255,.5);box-shadow:0 0 0 3px #ff6b7a,0 5px 0 3px #a33a4a}
#act{background:var(--lamp);color:var(--bark);font-size:23px;border:3px dashed rgba(122,78,54,.5);box-shadow:0 0 0 6px var(--lamp),0 11px 0 6px #b07a2e,0 20px 30px rgba(0,0,0,.45)}
#act.down{box-shadow:0 0 0 6px var(--lamp),0 6px 0 6px #b07a2e}
#snd,#emoB{background:var(--sheet);border:2px dashed var(--stitch);box-shadow:0 0 0 3px var(--sheet)}
#big{color:var(--lamp);text-shadow:0 3px 0 var(--thread),0 6px 0 rgba(8,6,24,.5),0 0 34px rgba(255,212,122,.5)}
#big.red{color:#ffc2cc;text-shadow:0 3px 0 #a33a4a,0 6px 0 rgba(8,6,24,.5),0 0 34px rgba(255,107,122,.5)}
#qcard{outline:2px dashed rgba(122,78,54,.4);outline-offset:-7px;box-shadow:0 8px 0 rgba(8,6,24,.4)}
/* 판 결과: 아래에서 올라오는 크림 라벨 */
#rres{background:var(--cream);color:var(--bark);border-radius:28px 28px 0 0;padding-top:26px;outline:2px dashed rgba(122,78,54,.4);outline-offset:-10px;
  box-shadow:0 -14px 40px rgba(0,0,0,.45);max-height:88vh;overflow-y:auto;touch-action:pan-y;animation:up .45s cubic-bezier(.2,1.2,.4,1)}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
#rres h2{color:var(--bark)}#rres p{color:#8a6448}#rres .eyebrow{color:#a0703c}
#rres .srow{color:var(--bark)}#rres .acs i{background:rgba(122,78,54,.15)}#rres .acs i.on{background:#c4863f}
#final .score,#rres .score{gap:12px}
.srow .face{border-style:solid}
@media (prefers-reduced-motion:reduce){.ctag,#rres,.wheel div.pick-final{animation:none}}
</style>

<div id="stage"><canvas id="cv"></canvas></div>
<div id="hud" hidden><div class="chip" id="chipL"></div><div class="chip" id="chipC"></div><div class="chip" id="chipR"></div></div>
<div id="qcard" hidden><p class="qn" id="qn"></p><p class="qt" id="qt"></p><div class="bar"><i id="qbar"></i></div><p class="ans" id="qans" hidden></p><p class="ex" id="qex" hidden></p></div>
<div id="big" hidden></div>
<button id="snd" aria-label="소리 끄기/켜기"></button>
<button id="emoB" hidden aria-label="이모티콘 보내기">😊</button>
<div id="emoP" hidden></div>
<button id="act" hidden aria-label="행동 버튼">멍!</button>

<section class="panel" id="menu">
  <div class="ctag"><h1>코츄 밤 파티</h1><p class="care">밤마다 둘이서 하는 인형 파티<br>꼭 안고 잘 것. 세탁기는 테디 전용.</p><div class="faces" id="tagFaces"></div></div>
  <ul class="rules">
    <li>매 판 미니게임 <span id="gcount">22</span>개 중 하나가 나와요. 진 사람이 다음 게임을 골라요.</li>
    <li>이기면 도토리 1개. 먼저 5개 모으면 최종 우승이에요.</li>
    <li>왼손은 화면을 밀어서 이동, 오른손은 큰 버튼 하나만 써요.</li>
  </ul>
  <div class="picks" id="picks" role="group" aria-label="캐릭터 고르기"></div>
  <div class="statbox" id="menuStats"></div>
  <label class="f" for="code">방 이름 (영문, 숫자)
    <input type="text" id="code" value="night" maxlength="24" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <p class="msg" id="connLine" role="status">연결 상태 확인 중…</p>
  <button class="btn ghost" id="permBtn" hidden>권한 설정 열기</button>
  <button class="btn" id="enter">입장하기</button>
  <button class="btn ghost" id="solo">컴퓨터랑 연습하기</button>
  <p class="msg" id="menuMsg" role="status"></p>
</section>

<section class="panel" id="wait" hidden>
  <p class="eyebrow" id="roomLine">방 night</p>
  <div class="duo"><div class="card" id="cardMe"></div><div class="card peer empty" id="cardPe"></div></div>
  <p class="eyebrow" id="gpickLabel" hidden>할 게임 고르기</p>
  <div class="gpick" id="gpick" role="group" aria-label="게임 고르기" hidden></div>
  <button class="btn" id="ready">준비!</button>
  <button class="btn ghost" id="leave">나가기</button>
</section>

<section class="panel see" id="spin" hidden>
  <p class="eyebrow" id="spinRound">1라운드</p>
  <h2>이번 게임은…</h2>
  <div class="wheel" id="wheel"></div>
</section>

<section class="panel see" id="intro" hidden>
  <p class="eyebrow" id="introRound">1라운드</p>
  <h1 id="introName"></h1>
  <ul class="rules" id="introRules"></ul>
  <div class="btnrow"><span>오른쪽 버튼</span><b id="introBtn"></b></div>
  <div class="vs" id="introStat"></div>
  <p class="cnt" id="introCnt">3</p>
</section>

<section id="rres" hidden>
  <h2 id="rT"></h2>
  <p id="rS"></p>
  <div class="score" id="rScore"></div>
  <p class="eyebrow" id="rPickLabel" hidden></p>
  <div class="gpick" id="rPickGrid" hidden></div>
  <button class="btn" id="rNext">다음 게임</button>
  <button class="btn ghost" id="rPick" hidden>다른 게임 고르기</button>
  <button class="btn ghost" id="rQuit">나가기</button>
</section>

<section class="panel" id="final" hidden>
  <p class="eyebrow">최종 결과</p>
  <h1 id="fT"></h1>
  <div class="score" id="fScore"></div>
  <button class="btn" id="fAgain">한 판 더</button>
  <button class="btn ghost" id="fQuit">나가기</button>
</section>

const PLANK=mk(160,48,g=>{for(let r=0;r<2;r++){const y=r*24;g.fillStyle=r?'#523a2a':'#4b3426';g.fillRect(0,y,160,24);g.fillStyle='rgba(0,0,0,.35)';g.fillRect(0,y+23,160,1);g.fillRect(r?60:120,y,1,24);
  g.strokeStyle='rgba(255,220,180,.06)';for(let i=0;i<4;i++){g.beginPath();g.moveTo(0,y+5+i*5);g.bezierCurveTo(50,y+3+i*5,110,y+8+i*5,160,y+5+i*5);g.stroke()}}});
const DOTS=mk(72,72,g=>{g.fillStyle='#1f2138';g.fillRect(0,0,72,72);g.fillStyle='rgba(236,231,220,.5)';[[14,16,3.5],[50,10,3],[34,44,3.5],[64,56,3]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill()})});
const QUILT=mk(40,40,g=>{g.fillStyle='#4a4575';g.fillRect(0,0,40,40);g.fillStyle='#55507f';g.fillRect(3,3,34,34);g.strokeStyle='rgba(255,255,255,.14)';g.setLineDash([3,3]);g.lineWidth=1.5;g.strokeRect(7,7,26,26);g.setLineDash([])});

function drawToken(x,y,ci,o){
  o=o||{};const sc=o.scale||1,r=(PR+1)*sc,by=Math.sin(o.bob||0)*2.2*sc;
  ctx.save();ctx.globalAlpha=o.alpha==null?1:o.alpha;
  ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(x,y+r*.85,r*.95,r*.38,0,0,7);ctx.fill();
  if(o.tag){const p=.5+.5*Math.sin((o.t||0)*8);const g=ctx.createRadialGradient(x,y,r,x,y,r+16+p*6);g.addColorStop(0,'rgba(255,90,95,.75)');g.addColorStop(1,'rgba(255,90,95,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r+22,0,7);ctx.fill()}
  ctx.translate(x,y+by);ctx.rotate(o.tilt||0);
  ctx.beginPath();ctx.arc(0,0,r+3*sc,0,7);ctx.fillStyle=o.tag?'#ff5a5f':(o.col||'#ff8a68');ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();const c=CHARS[ci];
  if(c.img&&c.img.complete&&c.img.naturalWidth)ctx.drawImage(c.img,-r,-r,r*2,r*2);
  else{ctx.fillStyle='#8c8a96';ctx.fillRect(-r,-r,r*2,r*2);ctx.fillStyle='#f6ecdc';ctx.font=(18*sc)+'px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(c.name.charAt(0),0,1)}
  ctx.restore();ctx.strokeStyle='rgba(255,244,224,.75)';ctx.lineWidth=1.3*sc;ctx.setLineDash([2.6*sc,2.4*sc]);ctx.beginPath();ctx.arc(0,0,r+1.5*sc,0,7);ctx.stroke();ctx.setLineDash([]);ctx.restore();
  if(o.label){ctx.save();ctx.font='12px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const lb=o.tag?o.label+' · 술래':o.label,tw=ctx.measureText(lb).width+10;ctx.fillStyle=o.tag?'#ff5a5f':'rgba(23,21,43,.82)';rr(x-tw/2,y-r-21,tw,15,7);ctx.fill();
    ctx.fillStyle=o.tag?'#fff':(o.col||'#ff8a68');ctx.fillText(lb,x,y-r-13);ctx.restore()}
}
function drawBubble(x,y,b,now,lift){
  if(!b||now>b.until)return;ctx.save();ctx.font='15px Jua, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  const w=ctx.measureText(b.text).width+16,yy=y-PR-46-(lift||0);ctx.fillStyle='#f6ecdc';rr(x-w/2,yy-12,w,24,12);ctx.fill();
  ctx.beginPath();ctx.moveTo(x-5,yy+11);ctx.lineTo(x,yy+18);ctx.lineTo(x+5,yy+11);ctx.fill();ctx.fillStyle='#2b1b0b';ctx.fillText(b.text,x,yy+1);ctx.restore();
}
function drawAcorn(x,y,t,sc){sc=sc||1;const b=Math.sin(t*3+x)*1.5;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);
  const g=ctx.createRadialGradient(0,0,2,0,0,22);g.addColorStop(0,'rgba(255,213,154,.4)');g.addColorStop(1,'rgba(255,213,154,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,22,0,7);ctx.fill();
  ctx.fillStyle='#c4863f';ctx.beginPath();ctx.ellipse(0,b+2,6,8,0,0,7);ctx.fill();ctx.fillStyle='#6b4a2a';ctx.beginPath();ctx.ellipse(0,b-3,7,4.5,0,Math.PI,0);ctx.fill();ctx.fillRect(-1,b-9,2,4);ctx.restore()}
function drawPointer(qx,qy,ci,col,t,label){
  const top=64,bot=H-130,l=26,r=W-26;if(qx>=l&&qx<=r&&qy>=top&&qy<=bot)return;
  const cx=W/2,cy=(top+bot)/2,dx=qx-cx,dy=qy-cy;
  const s=Math.min(dx?Math.abs((dx>0?r-cx:cx-l)/dx):1e9,dy?Math.abs((dy>0?bot-cy:cy-top)/dy):1e9);
  const ax=cx+dx*s,ay=cy+dy*s,a=Math.atan2(dy,dx);
  ctx.save();ctx.translate(ax,ay);ctx.save();ctx.rotate(a);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(26,0);ctx.lineTo(14,-8);ctx.lineTo(14,8);ctx.fill();ctx.restore();
  ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fillStyle=col;ctx.fill();
  if(ci!=null){ctx.save();ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.clip();const c=CHARS[ci];
    if(c.img&&c.img.complete&&c.img.naturalWidth)ctx.drawImage(c.img,-12,-12,24,24);else{ctx.fillStyle='#8c8a96';ctx.fillRect(-12,-12,24,24)}ctx.restore()}
  if(label){ctx.font='12px Jua, sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(label,0,4)}
  ctx.restore();
}

const C={phase:'menu',char:0,botChar:1,code:'night',nonce:newSeed(),myRn:null,lastPeerRn:null,

function dust(x,y){P({t:'dust',x,y,vx:(Math.random()-.5)*30,vy:(Math.random()-.5)*30,life:.4,max:.4,s:4+Math.random()*3})}
function confetti(x,y,n){const cs=['#ffd59a','#ff8a68','#7ec6ff','#f6ecdc'];for(let i=0;i<(n||46);i++){const a=Math.random()*6.28,v=80+Math.random()*220;P({t:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,g:360,life:1.6,max:1.6,c:cs[i%4],r:Math.random()*6})}}

function stepParts(dt){for(const p of C.parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;if(p.t==='conf')p.r+=dt*8}C.parts=C.parts.filter(p=>p.life>0)}
function drawParts(){
  for(const p of C.parts){const a=Math.max(0,p.life/p.max);ctx.save();ctx.globalAlpha=a;
    if(p.t==='heart'){ctx.fillStyle='#ff8a8a';ctx.font=p.s+'px sans-serif';ctx.textAlign='center';ctx.fillText('♥',p.x,p.y)}
    else if(p.t==='ring'){ctx.strokeStyle=p.c;ctx.lineWidth=4*a+1;ctx.beginPath();ctx.arc(p.x,p.y,(1-a)*p.R+10,0,7);ctx.stroke()}
    else if(p.t==='dust'){ctx.fillStyle='rgba(255,213,154,.7)';ctx.beginPath();ctx.arc(p.x,p.y,p.s*a,0,7);ctx.fill()}
    else if(p.t==='conf'){ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-3,-2,6,4)}
    else if(p.t==='txt'){ctx.font='18px Jua, sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(23,21,43,.85)';ctx.strokeText(p.text,p.x,p.y);ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y)}
    else if(p.t==='step'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,(1-a)*26+4,0,7);ctx.stroke()}
    ctx.restore()}
}
function bigText(t,sm,ms,red){const b=$('#big');b.textContent=t;b.className=(sm?'sm ':'')+(red?'red ':'')+'pop';b.hidden=false;C.bigUntil=ms?performance.now()+ms:0}
function vignette(px,py,r){screen();const g=ctx.createRadialGradient(px,py,r,px,py,Math.max(W,H)*.85);g.addColorStop(0,'rgba(10,8,28,0)');g.addColorStop(.55,'rgba(10,8,28,.2)');g.addColorStop(1,'rgba(10,8,28,.72)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}

/* 이동 공통 */
function knockFrom(p,ex,ey,v,res,R){const dx=p.x-ex,dy=p.y-ey,d=hyp(dx,dy)||1;if(d>=R)return false;p.kx=(p.kx||0)+dx/d*v*res;p.ky=(p.ky||0)+dy/d*v*res;const l=hyp(p.kx,p.ky);if(l>760){p.kx*=760/l;p.ky*=760/l}return true}
function sepFrom(p,q){const dx=p.x-q.x,dy=p.y-q.y,d=hyp(dx,dy);if(d<PR*2&&d>.01){const o=(PR*2-d)*.5;p.x+=dx/d*o;p.y+=dy/d*o}}
function smooth(op,dt,k){if(op.tx==null)return;const ox=op.x,oy=op.y,a=Math.min(1,dt*(k||12));op.x+=(op.tx-op.x)*a;op.y+=(op.ty-op.y)*a;
  op.tilt=(op.tilt||0)+(clamp((op.x-ox)/Math.max(dt,.001)*.0016,-.28,.28)-(op.tilt||0))*Math.min(1,dt*10);if(hyp(op.x-ox,op.y-oy)>.3)op.bob=(op.bob||0)+dt*12}
function walk(p,inp,sp,dt){const dec=Math.exp(-6*dt);p.x+=(inp.mx*inp.mag*sp+(p.kx||0))*dt;p.y+=(inp.my*inp.mag*sp+(p.ky||0))*dt;p.kx=(p.kx||0)*dec;p.ky=(p.ky||0)*dec;
  p.tilt=(p.tilt||0)+(clamp(inp.mx*inp.mag*.25,-.3,.3)-(p.tilt||0))*Math.min(1,dt*10);p.bob=(p.bob||0)+dt*(inp.mag>.05&&sp>0?8+sp/22:2)}
function botWalk(p,tx,ty,sp,dt){const dx=tx-p.x,dy=ty-p.y,l=hyp(dx,dy);const m=l<1?0:Math.min(1,l/(sp*dt+.01));return walk(p,{mx:l?dx/l:0,my:l?dy/l:0,mag:m},sp,dt)}
function remoteTo(op,g,minX,minY,maxX,maxY){const x=clamp(num(g.x,op.x),minX,maxX),y=clamp(num(g.y,op.y),minY,maxY);op.tx=x;op.ty=y;if(!op.ok){op.x=x;op.y=y;op.ok=true}}
function opCol(){return'#7ec6ff'}
function opName(){return C.M&&C.M.bot?'컴퓨터':'상대'}

/* 격자(미로·방) 공통 */
function gSolid(G,x,y){return x<0||y<0||x>=G.w||y>=G.h||G.g[y*G.w+x]===1}
function gResolve(G,p,T){
  for(let it=0;it<2;it++){const x0=Math.floor((p.x-PR)/T),x1=Math.floor((p.x+PR)/T),y0=Math.floor((p.y-PR)/T),y1=Math.floor((p.y+PR)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(!gSolid(G,tx,ty))continue;
      const rx=tx*T,ry=ty*T,cx=clamp(p.x,rx,rx+T),cy=clamp(p.y,ry,ry+T),dx=p.x-cx,dy=p.y-cy,d2=dx*dx+dy*dy;
      if(d2<PR*PR){if(d2===0){const l=p.x-rx,r=rx+T-p.x,t=p.y-ry,b=ry+T-p.y,m=Math.min(l,r,t,b);if(m===l)p.x=rx-PR;else if(m===r)p.x=rx+T+PR;else if(m===t)p.y=ry-PR;else p.y=ry+T+PR}
        else{const d=Math.sqrt(d2),k=(PR-d)/d;p.x+=dx*k;p.y+=dy*k}}}}}
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
function gBfs(G,tx,ty){const d=new Int16Array(G.w*G.h).fill(-1);if(gSolid(G,tx,ty))return d;const q=[tx,ty];d[ty*G.w+tx]=0;
  for(let h=0;h<q.length;h+=2){const x=q[h],y=q[h+1],v=d[y*G.w+x];for(const [dx,dy] of DIRS){const nx=x+dx,ny=y+dy;if(gSolid(G,nx,ny))continue;const k=ny*G.w+nx;if(d[k]>=0)continue;d[k]=v+1;q.push(nx,ny)}}return d}
function gStep(G,T,p,dmap,toward,state,dt){ /* 다음 칸 고르기: toward=true면 dmap 감소, false면 증가 */
  const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T);state.age=(state.age||0)+dt;
  if(!state.tgt||hyp(state.tgt[0]-p.x,state.tgt[1]-p.y)<6||state.age>(toward?.4:.7)){
    let best=null,bs=toward?1e9:-1e9;
    for(const [dx,dy] of DIRS){const nx=tx+dx,ny=ty+dy;if(gSolid(G,nx,ny))continue;const v=dmap[ny*G.w+nx];if(v<0)continue;const back=state.prev&&state.prev[0]===nx&&state.prev[1]===ny;
      const sc=toward?v+(back?.5:0):v+(back?-1.5:0)+Math.random()*.4;if(toward?sc<bs:sc>bs){bs=sc;best=[nx,ny]}}
    if(best){if(!state.tgt||Math.floor(state.tgt[0]/T)!==best[0]||Math.floor(state.tgt[1]/T)!==best[1])state.prev=[tx,ty];state.tgt=[(best[0]+.5)*T,(best[1]+.5)*T];state.age=0}}
  return state.tgt}
function drawGrid(G,T,camx,camy,z,wallFn){
  const vw=W/z,vh=H/z,x0=Math.max(0,Math.floor((camx-vw/2)/T)-1),x1=Math.min(G.w-1,Math.ceil((camx+vw/2)/T)+1),y0=Math.max(0,Math.floor((camy-vh/2)/T)-1),y1=Math.min(G.h-1,Math.ceil((camy+vh/2)/T)+1);
  ctx.fillStyle=pat(PLANK);ctx.fillRect(0,0,G.w*T,G.h*T);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){if(G.g[y*G.w+x]===0&&y>0&&G.g[(y-1)*G.w+x]===1){ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(x*T,y*T,T,10)}}
  wallFn(x0,x1,y0,y1);
}

/* ================= 게임 1: 이불 술래잡기 ================= */
const TagG=(()=>{
  const T=40,GW=19,GH=27,ROUND=40000,FREEZE=1.3,TMUL=1.24,TAGR=PR*2+12,BR=T*3.2,BOOST=1.35,BOTM=.92;let s=null;
  function gen(seed){const r=mulberry32(seed),g=new Uint8Array(GW*GH).fill(1),ix=(x,y)=>y*GW+x,st=[[1,1]];g[ix(1,1)]=0;
    while(st.length){const [x,y]=st[st.length-1];const ds=[[2,0],[-2,0],[0,2],[0,-2]].filter(([dx,dy])=>{const nx=x+dx,ny=y+dy;return nx>0&&ny>0&&nx<GW-1&&ny<GH-1&&g[ix(nx,ny)]===1});
      if(!ds.length){st.pop();continue}const [dx,dy]=ds[Math.floor(r()*ds.length)];g[ix(x+dx/2,y+dy/2)]=0;g[ix(x+dx,y+dy)]=0;st.push([x+dx,y+dy])}
    const inC=(x,y)=>x>0&&y>0&&x<GW-1&&y<GH-1;
    for(let y=1;y<GH-1;y+=2)for(let x=1;x<GW-1;x+=2){let o=0;for(const [dx,dy] of DIRS)if(!g[ix(x+dx,y+dy)])o++;if(o===1){const c=DIRS.filter(([dx,dy])=>g[ix(x+dx,y+dy)]===1&&inC(x+dx*2,y+dy*2));if(c.length){const [dx,dy]=c[Math.floor(r()*c.length)];g[ix(x+dx,y+dy)]=0}}}
    for(let y=1;y<GH-1;y++)for(let x=1;x<GW-1;x++){if(g[ix(x,y)]!==1)continue;let a=-1,b=-1;if(x%2===1&&y%2===0){a=ix(x,y-1);b=ix(x,y+1)}else if(x%2===0&&y%2===1){a=ix(x-1,y);b=ix(x+1,y)}if(a>=0&&!g[a]&&!g[b]&&r()<.1)g[ix(x,y)]=0}
    const kind=(seed>>>7)%4;if(kind){const g2=themeGrid(kind,mulberry32(seed^0x7a3)),G2={w:GW,h:GH,g:g2};if(conn(G2))g.set(g2);else return Object.assign(gen2(g,r,seed),{kind:0})}
    return Object.assign(gen2(g,r,seed),{kind})}
  function conn(G){G={w:GW,h:GH,g:G.g};let sx=-1,sy=-1;for(let i=0;i<GW*GH;i++)if(!G.g[i]){sx=i%GW;sy=Math.floor(i/GW);break}const d=gBfs(G,sx,sy);for(let i=0;i<GW*GH;i++)if(!G.g[i]&&d[i]<0)return false;return true}
  function themeGrid(kind,r){const g=new Uint8Array(GW*GH),ix=(x,y)=>y*GW+x;for(let x=0;x<GW;x++){g[ix(x,0)]=1;g[ix(x,GH-1)]=1}for(let y=0;y<GH;y++){g[ix(0,y)]=1;g[ix(GW-1,y)]=1}
    const safe=(x,y)=>(x<=3&&y<=3)||(x>=GW-4&&y>=GH-4);
    if(kind===1){for(let y=2;y<GH-2;y++)for(let x=2;x<GW-2;x++)if(!safe(x,y)&&r()<.17&&!(x%2===0&&y%2===0&&r()<.5))g[ix(x,y)]=1}
    else if(kind===2){for(let k=1;k<=3;k++){const x0=3*k,y0=3*k+1,x1=GW-1-3*k,y1=GH-2-3*k;if(x1-x0<3)break;const ring=[];for(let x=x0;x<=x1;x++){ring.push([x,y0]);ring.push([x,y1])}for(let y=y0+1;y<y1;y++){ring.push([x0,y]);ring.push([x1,y])}

const PillowG=(()=>{

  function fallCheck(p,who,now){if(!p.out&&hyp(p.x,p.y)>R(now)+PR*.4){p.out=Math.max(.01,(now-s.t0)/1000);p.fall=now;bubble(who,'으앗!',1);beep(200,.4,'sawtooth',.06)}}

  return{

    rules:['이불 밖으로 먼저 떨어지는 쪽이 져요. 이불이 점점 작아져요.','베개!로 가까운 상대를 세게 쳐요. 힘이 셀수록 멀리 날아가요.','가끔 👑 왕베개가 떨어져요. 먹으면 다음 한 방이 3배로 날아가요!'],

      }else if(!op.out){smooth(op,dt,14)}},
    onRemote(g){remoteTo(s.op,g,-600,-600,600,600);s.op.vx=num(g.vx);s.op.vy=num(g.vy);if(Array.isArray(g.kg))g.kg.forEach(i=>{if(Number.isInteger(i)&&i>=0&&i<3)s.kg.add(i)});s.op.big=!!g.bg;if(num(g.out)>0&&!s.op.out){s.op.out=num(g.out);s.op.fall=performance.now();bubble('op','으앗!',1)}

      const bs=AC.createOscillator(),bg=AC.createGain();bs.type='triangle';bs.frequency.value=110*Math.pow(2,sc[pat[b%8]]/12);bg.gain.setValueAtTime(.07,t);bg.gain.exponentialRampToValueAtTime(.001,t+.4);bs.connect(bg);bg.connect(OUT());bs.start(t);bs.stop(t+.42);s.nodes.push(bs)}}catch(e){}}

          if(s.cb%8===0){sendEv({k:'heart'});bubble('me','하트 발사!',1);hearts(W/2,H-300,8)}}else beep(220,.05,'sine',.03)}

  function physics(p,c,dt){if(p.inCup)return;const sp=hyp(p.vx,p.vy);if(sp<6){p.vx=p.vy=0;return}const sand=c.sand.some(([x,y,r])=>hyp(p.x-x,p.y-y)<r);const f=Math.exp(-(sand?3.2:1.05)*dt);p.vx*=f;p.vy*=f;

  return{

    rules:['형 방 바닥에서 도토리를 굴려 컵에 넣어요. 3홀 동안 친 횟수가 적은 쪽이 이겨요.','화면을 밀어서 방향을 정하고, 버튼을 꾹 누르면 힘이 차올라요. 떼는 순간 쳐요.','모래(러그)는 느려지고 벽에 맞으면 튕겨요. 한 홀에 7번까지예요. 같은 홀이면 상대 도토리를 맞혀 밀어낼 수도 있어요.'],
    init(o){const mk=sd=>({x:0,y:0,vx:0,vy:0,hole:0,st:0,strokes:[],inCup:false,aim:-Math.PI/2,side:sd,done:false,wait:0});s={o,t0:o.now,me:mk(o.me?1:-1),op:Object.assign(mk(o.me?-1:1),{ok:true}),charging:false,pw:0,pwT:0,ended:false,endAt:0,bot:o.bot?{t:1.5}:null};

      if(s.bot){const b=op,bc=COURSES[b.hole],bt=s.bot;if(b.wait>0){b.wait-=dt;if(b.wait<=0)newHole(b,b.hole+1)}
        if(!b.inCup&&!b.done&&b.wait<=0&&hyp(b.vx,b.vy)<6){bt.t-=dt;if(bt.t<=0){bt.t=1.2+Math.random();const [qx,qy]=bc.cup;let tx=qx,ty=qy;const blocked=walls(bc).slice(0,bc.walls.length).some(([x,y,w,h])=>{for(let k=1;k<10;k++){const px=b.x+(qx-b.x)*k/10,py=b.y+(qy-b.y)*k/10;if(px>x-BR&&px<x+w+BR&&py>y-BR&&py<y+h+BR)return true}return false});
          if(blocked){tx=b.x+(Math.random()<.5?-1:1)*140;ty=b.y-200}const a=Math.atan2(ty-b.y,tx-b.x)+gauss(Math.random)*.06,d=hyp(tx-b.x,ty-b.y),v=clamp(Math.sqrt(d)*34+gauss(Math.random)*40,110,910);b.vx=Math.cos(a)*v;b.vy=Math.sin(a)*v;b.st++}}
        physics(b,bc,dt);if(b.inCup&&b.strokes[b.hole]==null)sunk(b,'op');if(!b.inCup&&!b.done&&b.st>=MAXS&&hyp(b.vx,b.vy)<6){b.st=MAXS+1;b.inCup=true;sunk(b,'op')}}
      else smooth(op,dt,16)},
    onRemote(g){const h=clamp(Math.floor(num(g.h)),0,HOLES-1);if(h!==s.op.hole){s.op.hole=h;s.op.x=num(g.x);s.op.y=num(g.y)}remoteTo(s.op,g,-400,-400,400,400);s.op.st=clamp(Math.floor(num(g.st)),0,9);s.op.inCup=!!g.ic;s.op.done=!!g.dn;s.op.vx=num(g.vx);s.op.vy=num(g.vy);
      if(Array.isArray(g.sk))s.op.strokes=g.sk.slice(0,HOLES).map(v=>clamp(Math.floor(num(v,8)),1,8))},

    draw(now){const t=now/1000,m=s.me,c=COURSES[m.hole],z=Math.min(W/(c.w+70),(H-170)/(c.h+70));
      screen();ctx.fillStyle='#2a2140';ctx.fillRect(0,0,W,H);cam(0,0,z,0,14);ctx.fillStyle=pat(PLANK);ctx.fillRect(-W/z,-H/z,W*2/z,H*2/z);
      ctx.fillStyle='rgba(0,0,0,.35)';rr(-c.w/2-6,-c.h/2-2,c.w+12,c.h+12,18);ctx.fill();ctx.fillStyle='#5fae58';rr(-c.w/2,-c.h/2,c.w,c.h,16);ctx.fill();

/* ================= 게임 16: 형 목 위 쟁탈전 ================= */
const NeckG=(()=>{
  const AW=520,AH=700,TMAX=40000,ZX=0,ZY=-60,ZR=60,GRIP=.55,GCD=1.1,SAR=[18,22];let s=null;
  function plan(seed){const r=mulberry32(seed^0x510e527f),ev=[];let t=4+r()*1.5;while(t<TMAX/1000){const d=r()<.5?-1:1;ev.push({w:t,a:t+.75,e:t+1.4,d});t+=5+r()*3}return ev}
  const ZS=[{x:0,y:-60,n:'형 목 위'},{x:-150,y:40,n:'형 왼쪽 어깨'},{x:150,y:40,n:'형 오른쪽 어깨'},{x:0,y:200,n:'형 배 위'}];
  function plan2(seed){const r=mulberry32(seed^0x6a09e667),zs=[{t:0,i:0}];let t=9+r()*2;while(t<TMAX/1000){let i;do{i=Math.floor(r()*4)}while(i===zs[zs.length-1].i);zs.push({t,i});t+=8+r()*3}
    const hot=[[12+r()*3],[27+r()*4]].map(([a])=>[a,a+4]);const hd=[];let h=6+r()*2;while(h<TMAX/1000-2){hd.push({t:h,y:-150+r()*440,d:r()<.5?1:-1});h+=5+r()*2.5}return{zs,hot,hd}}
  const zoneI=el=>{let i=0;for(const z of s.zs)if(el>=z.t)i=z.i;return i},zone=el=>ZS[zoneI(el)];
  const nextZ=el=>{for(const z of s.zs)if(z.t>el&&z.t-el<2)return z;return null};
  const isHot=el=>s.hot.some(([a,b])=>el>=a&&el<b);
  const handAt=el=>{for(const h of s.hd){if(el>=h.t&&el<h.t+.8)return{p:'warn',h};if(el>=h.t+.8&&el<h.t+1.7){const k=(el-h.t-.8)/.9;return{p:'sweep',h,x:-h.d*(AW/2+60)+h.d*(AW+120)*k}}}return null};
  const roll=el=>{for(const e of s.ev){if(el>=e.w&&el<e.a)return{p:'warn',e};if(el>=e.a&&el<e.e)return{p:'roll',e}}return{p:'calm'}};
  const inZ=(p,el)=>{const z=zone(el);return hyp(p.x-z.x,p.y-z.y)<ZR};
  const sarang=el=>el>=SAR[0]&&el<SAR[1];
  function shoved(p,e,res,who){if(p.grip>0){bubble(who,'꽉!',.6);return}p.kx=(p.kx||0)+num(e.dx)*clamp(num(e.v),0,700)*res;p.ky=(p.ky||0)+num(e.dy)*clamp(num(e.v),0,700)*res;bubble(who,'으악!',.8);if(who==='me'){C.shake=.2;beep(170,.15,'square',.05)}}
  function body(p,who,inpx,inpy,mag,sp,dt,el,bt){
    p.grip=Math.max(0,p.grip-dt);p.cd=Math.max(0,p.cd-dt);
    walk(p,{mx:inpx,my:inpy,mag},sp,dt);
    const r=roll(el);if(r.p==='roll'&&p.grip<=0){p.x+=r.e.d*330*dt;p.y+=60*dt}
    const Z=zone(el);if(sarang(el)&&hyp(p.x-Z.x,p.y-Z.y)<ZR+30){const dx=p.x-Z.x,dy=p.y-Z.y,d=hyp(dx,dy)||1;p.x+=dx/d*220*dt;p.y+=dy/d*220*dt}
    const hn=handAt(el);if(hn&&hn.p==='sweep'){if(Math.abs(p.y-hn.h.y)<46&&Math.abs(p.x-hn.x)<46&&p.hitT!==hn.h.t){p.hitT=hn.h.t;if(p.grip>0)bubble(who,'꽉 버텼다!',.8);else{p.kx=(p.kx||0)+hn.h.d*620;p.ky=(p.ky||0)+30;bubble(who,'형 손에 쓸려감!',1);if(who==='me'){C.shake=.25;beep(140,.2,'sawtooth',.05)}}}}
    p.x=clamp(p.x,-AW/2+PR,AW/2-PR);p.y=clamp(p.y,-AH/2+120,AH/2-PR);
    if(p.x<-AW/2+PR+2||p.x>AW/2-PR-2){if(!p.fell){p.fell=1;bubble(who,'떨어졌다!',.8)}}else p.fell=0}
  return{
    id:'neck',name:'형 목 위 쟁탈전',btn:'꽉!',stat:'pow',stick:true,
    rules:['반짝이는 자리에 혼자 있으면 점수가 올라요. 둘 다 있으면 자리싸움이라 점수가 멈춰요. 자리는 형 목 → 어깨 → 배 위로 계속 옮겨 다녀요!','형 손 ✋이 쓱 지나가면 쓸려가요. 형이 쓰다듬는 시간엔 점수 2배!','뒤척임·형 손은 꽉!으로 버텨요. 꽉!은 상대 쪽으로 박치기도 돼요. 중간에 진짜 사랑이가 나타나 둘 다 밀어내요. 40초 뒤 점수 높은 쪽 승리!'],

      for(let i=0;i<4;i++){const opts=[];for(let x=0;x<4;x++){if(x!==i){opts.push({t:'is',x});opts.push({t:'not',x})}}opts.push({t:'self'});for(let x=0;x<4;x++)for(let y=x+1;y<4;y++)if(x!==i&&y!==i)opts.push({t:'either',x,y});
        const want=i!==liar;const ok=opts.filter(o=>truth(o,i,cul)===want);st.push(ok[Math.floor(r()*ok.length)])}
      let sols=[];for(let c=0;c<4;c++){const f=st.map((o,i)=>truth(o,i,c)?0:1);if(f.reduce((a,b)=>a+b,0)===1)sols.push({c,l:f.indexOf(1)})}
      if(sols.length===1&&sols[0].l===liar&&sols[0].c===cul)return{st,cul,liar,cs:CASES[Math.floor(r()*CASES.length)]}}

    for(const v in known)if(known[v].length>=2)return known[v][0];const unk=cand.filter(i=>s.bmem[i]==null);const pool=unk.length?unk:cand;return pool[Math.floor(Math.random()*pool.length)]}

/* ================= 게임 20: 방방 댄스 따라하기 ================= */
const DanceG=(()=>{
  const NR=9,START=3,STEP=.62,ARR=['↑','→','↓','←'],DV=[[0,-1],[1,0],[0,1],[-1,0]];let s=null;

    if(a.ok&&b.ok)w='both';else if(a.ok)w='me';else if(b.ok)w='op';else w=a.n>b.n?'me':b.n>a.n?'op':(a.t<b.t?'me':b.t<a.t?'op':'none');

let hudAt=0;
function frame(){
  const now=performance.now(),dt=Math.min(.05,(now-C.last)/1000||.016);C.last=now;readInput();
  const pp=Net.peer(),M=C.M;
  tickEmo(pp);
  if(C.phase==='wait')tickWait(pp);
  else if(C.phase==='spin')tickSpin(now);
  else if(C.phase==='intro')tickIntro(now);
  else if(C.phase==='play'&&C.G){const G=C.G;
    if(!M.bot&&pp&&pp.m===M.seed){if(pp.r===M.round&&pp.g)G.onRemote(pp.g);if(Array.isArray(pp.evq))for(const e of pp.evq){if(e&&num(e.n)>C.seenEv){C.seenEv=num(e.n);if(e.r===M.round&&e.m===M.seed)G.onEv(e,now)}}}
    G.step(dt,now,In);
    if(!M.bot&&now-C.lastSend>50){C.lastSend=now;pres({m:M.seed,r:M.round,g:G.state()})}
    if(!C.decided){if(M.bot||M.idx===0){const r=G.result(now);if(r)declare(r)}else if(pp&&pp.res&&pp.res.m===M.seed&&pp.res.r===M.round){C.decided=true;finishRound(pp.res.w)}}}
  else if(C.phase==='rres'){
    if(C.loserPick==='op'&&!M.bot&&!(M.chosen&&M.chosen.r===M.round+1)&&pp&&pp.pick&&pp.pick.m===M.seed&&pp.pick.r===M.round+1&&Number.isInteger(pp.pick.g)&&pp.pick.g>=0&&pp.pick.g<GAMES.length){M.chosen={r:M.round+1,g:pp.pick.g,by:'op'};$('#rPickLabel').textContent=opName()+'가 고른 게임: '+GAMES[pp.pick.g].name}
    if(C.loserPick==='me'&&!(M.chosen&&M.chosen.r===M.round+1)&&now-C.rresAt>25000)choosePick(Math.floor(Math.random()*GAMES.length));
    if(C.loserPick!=='me'&&now-C.rresAt>7000)markNext();
    const pickOk=!C.loserPick||(M.chosen&&M.chosen.r===M.round+1);
    if(pickOk&&C.nxMine===M.round&&(M.bot||(pp&&pp.nx&&pp.nx.m===M.seed&&pp.nx.r>=M.round)))nextRound()}
  In.pressed=false;In.tap=null;In.rel=false;
  if(C.bigUntil&&now>C.bigUntil){$('#big').hidden=true;C.bigUntil=0}
  C.shake=Math.max(0,C.shake-dt);stepParts(dt);
  if(C.G&&(C.phase==='play'||C.phase==='rres'))C.G.draw(now);else ambient(now);
  if(C.phase==='play'&&C.G&&C.G.stick&&J.active){screen();ctx.strokeStyle='rgba(255,255,255,.3)';ctx.fillStyle='rgba(255,255,255,.07)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(J.ox,J.oy,52,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.42)';ctx.beginPath();ctx.arc(clamp(J.sx,J.ox-52,J.ox+52),clamp(J.sy,J.oy-52,J.oy+52),22,0,7);ctx.fill()}
  if(C.phase==='play'&&C.G&&now-hudAt>90){hudAt=now;const h=C.G.hud(now);$('#chipL').textContent=M.round+'R · '+h.t;$('#chipL').classList.toggle('low',!!h.low);
    const c=$('#chipC');c.textContent=h.c;c.className='chip '+(h.cls||'');$('#chipR').textContent='나 '+M.pts[M.idx]+' : '+M.pts[1-M.idx];
    const b=C.G.button();if(act.textContent!==b.label)act.textContent=b.label;act.classList.toggle('off',!!b.off);act.style.setProperty('--cd',clamp(num(b.cd),0,1).toFixed(3))}
  requestAnimationFrame(frame);
}
function ambient(now){screen();ctx.fillStyle='#1d1a3a';ctx.fillRect(0,0,W,H);ctx.save();ctx.globalAlpha=.4;ctx.fillStyle=pat(PLANK);ctx.translate(-(now/50)%160,0);ctx.fillRect(0,H*.55,W+320,H);ctx.restore();
  const g=ctx.createRadialGradient(W/2,H*.2,10,W/2,H*.2,Math.max(W,H)*.75);g.addColorStop(0,'rgba(255,213,154,.25)');g.addColorStop(1,'rgba(23,21,43,.9)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);drawParts()}

/* ================= 온라인 연결: Supabase Realtime + WebRTC 직접 연결 ================= */
const SupaRoom=(()=>{
  let client=null,ch=null,me={},peer=null,peerId=null,lastRx=0,dirty=false,lastTx=0,pc=null,dc=null,mode='relay',listeners=[],timers=[],rtcTried=0;
  const myId=Math.random().toString(36).slice(2,10);
  const emitPeers=()=>listeners.forEach(f=>{try{f({})}catch(e){}});
  function raw(msg){if(dc&&dc.readyState==='open'){try{dc.send(JSON.stringify(msg));return}catch(e){}}if(ch)ch.send({type:'broadcast',event:'m',payload:msg}).catch(()=>{})}
  function flush(force){const now=performance.now(),p2p=dc&&dc.readyState==='open',iv=p2p?33:70;if(!force&&!dirty&&now-lastTx<500)return;if(now-lastTx<iv)return;dirty=false;lastTx=now;raw({t:'st',from:myId,s:me})}
  function sig(x){if(ch&&peerId)ch.send({type:'broadcast',event:'m',payload:Object.assign({t:'sig',from:myId,to:peerId},x)}).catch(()=>{})}
  function closePc(){try{dc&&dc.close()}catch(e){}try{pc&&pc.close()}catch(e){}pc=null;dc=null;mode='relay'}
  function setupPc(initiator){closePc();if(!window.RTCPeerConnection)return;rtcTried=performance.now();
    pc=new RTCPeerConnection({iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]});
    pc.onicecandidate=e=>{if(e.candidate)sig({type:'ice',data:e.candidate.toJSON?e.candidate.toJSON():e.candidate})};
    pc.onconnectionstatechange=()=>{if(pc&&(pc.connectionState==='failed'||pc.connectionState==='closed'))mode='relay'};
    const bind=c=>{dc=c;dc.onopen=()=>{mode='p2p';flush(true);emitPeers()};dc.onclose=()=>{mode='relay';emitPeers()};dc.onmessage=e=>{try{onMsg(JSON.parse(e.data))}catch(_){}}};
    if(initiator){bind(pc.createDataChannel('g',{ordered:false,maxRetransmits:0}));pc.createOffer().then(o=>pc.setLocalDescription(o)).then(()=>sig({type:'offer',data:pc.localDescription.toJSON?pc.localDescription.toJSON():pc.localDescription})).catch(()=>{})}
    else pc.ondatachannel=e=>bind(e.channel)}
  async function handleSig(m){try{
    if(m.type==='offer'){setupPc(false);await pc.setRemoteDescription(m.data);const a=await pc.createAnswer();await pc.setLocalDescription(a);sig({type:'answer',data:pc.localDescription.toJSON?pc.localDescription.toJSON():pc.localDescription})}
    else if(m.type==='answer'&&pc)await pc.setRemoteDescription(m.data);
    else if(m.type==='ice'&&pc)await pc.addIceCandidate(m.data)}catch(e){}}
  function meetPeer(id){if(peerId===id)return;peerId=id;closePc();if(myId<peerId)setTimeout(()=>{if(peerId===id&&!pc)setupPc(true)},300)}
  function onMsg(m){if(!m||m.from===myId)return;if(m.to&&m.to!==myId)return;lastRx=performance.now();
    if(m.t==='st'&&m.s&&typeof m.s==='object'){meetPeer(m.from);peer=m.s;emitPeers()}
    else if(m.t==='sig'){meetPeer(m.from);handleSig(m)}}
  const api={
    async join(code){
      if(!window.supabase||!window.KOCHU_SUPA)throw new Error('no-supabase');
      if(!client)client=window.supabase.createClient(window.KOCHU_SUPA.url,window.KOCHU_SUPA.key,{realtime:{params:{eventsPerSecond:25}}});
      api.leave();me={};
      ch=client.channel('kochu-'+code,{config:{broadcast:{self:false,ack:false},presence:{key:myId}}});
      ch.on('broadcast',{event:'m'},({payload})=>onMsg(payload));
      ch.on('presence',{event:'sync'},()=>{const ids=Object.keys(ch.presenceState()).filter(k=>k!==myId);if(!ids.length){if(peer){peer=null;peerId=null;closePc();emitPeers()}}else if(!peerId)meetPeer(ids[0]);flush(true)});
      await new Promise((res,rej)=>{const to=setTimeout(()=>rej(new Error('timeout')),12000);ch.subscribe(st=>{if(st==='SUBSCRIBED'){clearTimeout(to);res()}else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'){clearTimeout(to);rej(new Error(st))}})});
      await ch.track({id:myId});
      timers.push(setInterval(()=>flush(false),15));
      timers.push(setInterval(()=>{const now=performance.now();if(peer&&now-lastRx>9000){peer=null;peerId=null;closePc();emitPeers()}
        if(peerId&&myId<peerId&&(!dc||dc.readyState!=='open')&&now-rtcTried>10000&&rtcTried<1e12)setupPc(true)},1000));
      return api},
    presence(patch){for(const k in patch){if(patch[k]===null)delete me[k];else me[k]=patch[k]}dirty=true;return Promise.resolve()},
    peers(){return peer?[{peer:peerId,isMe:false,kind:'viewer',guest:false,by:null,presence:peer}]:[]},
    onPeers(fn){listeners.push(fn);return()=>{listeners=listeners.filter(f=>f!==fn)}},
    async leave(){timers.forEach(clearInterval);timers=[];closePc();if(ch&&client){try{await client.removeChannel(ch)}catch(e){}}ch=null;peer=null;peerId=null;listeners=[]},
    mode:()=>mode
  };
  return api})();

/* ================= 연결 확인 / 메뉴 ================= */
const capInfo={perm:null,state:'?',room:null,done:false};let probeP=null;
function probe(){if(probeP)return probeP;probeP=(async()=>{if(window.KOCHU_SUPA&&window.supabase){capInfo.state='supa';capInfo.room=SupaRoom;return}const c=window.claude;if(!c||typeof c.use!=='function'){capInfo.state='noclaude';return}
  try{capInfo.perm=await c.use('permissions')}catch(e){capInfo.perm=null}if(capInfo.perm){try{capInfo.state=await capInfo.perm.state('room')}catch(e){capInfo.state='err'}}else capInfo.state='noperm';
  try{capInfo.room=await c.use('room')}catch(e){capInfo.room=null}})().then(()=>{capInfo.done=true;updateConn()});return probeP}
function updateConn(){const el=$('#connLine'),pb=$('#permBtn');pb.hidden=true;el.className='msg';if(!capInfo.done){el.textContent='연결 상태 확인 중…';return}
  if(capInfo.room){el.textContent='온라인 연결 가능';el.classList.add('okc');return}
  const m={noclaude:'아티팩트 화면이 아니라 일반 페이지로 열렸어요.',prompt:'권한 허용이 필요해요. 입장하기를 누르면 허용 창이 떠요.',denied:'권한이 꺼져 있어요. 아래 버튼으로 켜 주세요.',unavailable:'이 계정·화면에서는 온라인 연결을 쓸 수 없는 상태예요.'};
  el.textContent=(m[capInfo.state]||'지금은 온라인 연결을 쓸 수 없어요. 컴퓨터랑 연습은 돼요.')+' (진단: '+capInfo.state+')';if(capInfo.state==='denied')pb.hidden=false}
$('#permBtn').addEventListener('click',async()=>{try{if(capInfo.perm)await capInfo.perm.manage()}catch(e){}probeP=null;capInfo.done=false;updateConn();probe()});
function buildPicks(){const box=$('#picks');box.innerHTML='';CHARS.forEach((c,i)=>{const b=document.createElement('button');b.className='pick';b.type='button';b.setAttribute('aria-pressed',String(i===C.char));
  b.innerHTML='<span class="face">'+faceHTML(i)+'</span><span>'+c.name+'</span>';b.addEventListener('click',()=>{C.char=i;try{localStorage.setItem('kochu.char',String(i))}catch(e){}buildPicks()});box.appendChild(b)});
  $('#menuStats').innerHTML='<p>'+CHARS[C.char].line+'</p>'+statRows(C.char)}
function renderWait(){const pp=Net.peer(),bot=Net.mode==='bot';$('#roomLine').textContent=bot?'컴퓨터랑 연습':'방 '+C.code+(Net.room&&Net.room.mode?(pp?(Net.room.mode()==='p2p'?' · 직접 연결됨':' · 서버로 연결됨'):' · 상대를 기다리는 중'):'');
  $('#cardMe').innerHTML='<span class="face">'+faceHTML(C.char)+'</span><span class="who">나 · '+CHARS[C.char].name+'</span><span class="state '+(C.myRn!=null||bot?'ok':'')+'">'+(C.myRn!=null||bot?'준비 완료':'고르는 중')+'</span>'+statRows(C.char);
  const cp=$('#cardPe');
  if(bot){cp.className='card peer';cp.innerHTML='<span class="face">'+faceHTML(C.botChar)+'</span><span class="who">컴퓨터 · '+CHARS[C.botChar].name+'</span><span class="state ok">준비 완료</span>'+statRows(C.botChar)}
  else if(pp){const ci=Number.isInteger(pp.c)?clamp(pp.c,0,CHARS.length-1):0,rd=pp.rd===true&&pp.rn&&pp.rn!==C.lastPeerRn;cp.className='card peer';cp.innerHTML='<span class="face">'+faceHTML(ci)+'</span><span class="who">상대 · '+CHARS[ci].name+'</span><span class="state '+(rd?'ok':'')+'">'+(rd?'준비 완료':'고르는 중')+'</span>'+statRows(ci)}
  else{cp.className='card peer empty';cp.innerHTML='<span class="face">?</span><span class="who">상대</span><span class="state">기다리는 중</span>'}
  const gp=$('#gpick');gp.hidden=!bot;$('#gpickLabel').hidden=!bot;if(bot){gp.innerHTML='';[-1].concat(GAMES.map((_,i)=>i)).forEach(i=>{const x=document.createElement('button');x.type='button';x.textContent=i<0?'랜덤':GAMES[i].name;x.setAttribute('aria-pressed',String(C.soloPick===i));
    x.addEventListener('click',()=>{C.soloPick=i;try{localStorage.setItem('kochu.pick',String(i))}catch(e){}renderWait()});gp.appendChild(x)})}
  const b=$('#ready');if(bot){b.disabled=false;b.textContent='시작'}else if(!pp){b.disabled=true;b.textContent='상대를 기다리는 중'}else if(C.myRn==null){b.disabled=false;b.textContent='준비!'}else{b.disabled=true;b.textContent='상대 준비를 기다리는 중'}}
function toWait(){C.phase='wait';if(C.G&&C.G.cleanup)C.G.cleanup();C.G=null;show(['menu','rres','final','spin','intro','hud'],false);$('#act').hidden=true;$('#qcard').hidden=true;$('#big').hidden=true;$('#wait').hidden=false;renderWait()}
function tickWait(pp){if(Net.mode==='room'&&C.myRn!=null&&pp&&pp.rn&&pp.rn!==C.lastPeerRn&&(pp.rd===true||pp.m===(((C.myRn^pp.rn)>>>0)||1))){const seed=((C.myRn^pp.rn)>>>0)||1,idx=(C.myRn<pp.rn||(C.myRn===pp.rn&&C.nonce<pp.n))?0:1;
  C.lastPeerRn=pp.rn;C.myRn=null;startMatch(seed,idx,Number.isInteger(pp.c)?clamp(pp.c,0,CHARS.length-1):0,false)}}
function pressReady(){audioInit();if(Net.mode==='bot'){startMatch(newSeed(),0,C.botChar,true);return}if(C.myRn!=null)return;C.myRn=newSeed();pres({rn:C.myRn,rd:true,c:C.char});renderWait()}
async function enter(){audioInit();const raw=$('#code').value.toLowerCase().replace(/[^a-z0-9_.-]/g,'').replace(/^[^a-z0-9]+/,'').slice(0,40);const code=raw||'night';C.code=code;try{localStorage.setItem('kochu.code',code)}catch(e){}
